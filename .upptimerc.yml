owner: pontusk
repo: upptime

sites:
  - name: RPG Go
    url: https://rpg.junknet.xyz
  - name: Recipes
    url: https://recipes.junknet.xyz
  - name: Books
    url: https://calibre.junknet.xyz
    # Calibre-Web requires a login, so anonymous checks get a 401. This list
    # REPLACES Upptime's default set rather than adding to it, so the defaults
    # are repeated here with 401 appended.
    expectedStatusCodes:
      [200, 201, 202, 203, 204, 205, 206, 207, 208, 226, 300, 301, 302, 303, 304, 305, 306, 307, 308, 401]
  - name: Shadowrun rules wiki
    url: https://sr-wiki.junknet.xyz

status-website:
  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This page contains uptime info for Pontus's sites.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
